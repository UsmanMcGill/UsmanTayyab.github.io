name: Publish live and development preview
on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved live website
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-source
          persist-credentials: false

      - name: Checkout development website
        uses: actions/checkout@v4
        with:
          ref: development
          path: dev-source
          persist-credentials: false

      - name: Prepare website and preview
        shell: bash
        run: |
          mkdir -p _site/preview
          rsync -a --exclude='.git' --exclude='.github' live-source/ _site/
          rsync -a --exclude='.git' --exclude='.github' dev-source/ _site/preview/
          test -f _site/index.html
          test -f _site/preview/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both versions
        id: deployment
        uses: actions/deploy-pages@v4
